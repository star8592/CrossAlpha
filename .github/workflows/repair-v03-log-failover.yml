name: CrossAlpha V03 Log Failover Repair

on:
  push:
    branches:
      - feat/rust-core-v01

permissions:
  contents: write

concurrency:
  group: crossalpha-v03-log-failover-repair
  cancel-in-progress: true

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[v03-log-failover-repair]')
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/rust-core-v01
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'

      - name: Apply V03 cycle failover patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v03_log_failover_cycle_patch.py
          git diff --check
          python -m compileall -q src/crossalpha/state/v03_logs.py src/crossalpha/state/v03_preflight.py src/crossalpha/state/v03_cycle.py
          ruff check src/crossalpha/state/v03_logs.py src/crossalpha/state/v03_preflight.py src/crossalpha/state/v03_cycle.py

      - name: Verify Python suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q

      - name: Commit verified cycle patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/crossalpha/state/v03_cycle.py; then
            echo 'No cycle patch to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/crossalpha/state/v03_cycle.py
          git commit -m 'fix: use failover Borrow-log provider in V03 cycle'
          git push origin HEAD:feat/rust-core-v01
