name: CrossAlpha State V0.4 Parity Repair

on:
  push:
    branches:
      - feat/rust-core-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[state-v04-repair]')
    runs-on: [self-hosted, linux, x64, crossalpha]
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/rust-core-v01
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic Python environment
        run: python -m pip install -e '.[dev]'

      - name: Apply focused State V0.4 repair
        run: |
          set -euo pipefail
          python scripts/repair_state_v04_parity.py
          cargo fmt --all
          git diff --check

      - name: Verify State V0.4 deterministic parity
        run: |
          set -euo pipefail
          cargo build --workspace
          python scripts/verify_rust_state_kernel_parity.py

      - name: Commit repair
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/crossalpha-state/src/v04.rs
          git commit -m 'fix: align State V0.4 deterministic parity'
          git push origin HEAD:feat/rust-core-v01
