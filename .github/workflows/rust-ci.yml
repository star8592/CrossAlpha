name: CrossAlpha Rust CI

on:
  push:
    branches:
      - main
      - feat/rust-core-v01
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: crossalpha-rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CROSSALPHA_CLOUD_CI: "1"
  TIINGO_API_TOKEN: ""
  FRED_API_KEY: ""
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""

jobs:
  deterministic-gates:
    name: Rust + Python deterministic gates
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner safety preflight
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "workspace=$GITHUB_WORKSPACE"
          echo "production_data=false"
          echo "production_writes=false"
          test "$GITHUB_WORKSPACE" != "/mnt/disk2/CrossAlpha"
          test ! -e /mnt/disk2/CrossAlphaData/.crossalpha-ci-write-probe

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Python reference environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rustfmt gate
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy hard gate
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        id: rust_tests
        continue-on-error: true
        run: cargo test --workspace

      - name: Python reference tests
        id: python_tests
        continue-on-error: true
        run: pytest -q

      - name: Debug build
        id: debug_build
        continue-on-error: true
        run: cargo build --workspace

      - name: Deterministic Python-Rust parity
        id: parity
        continue-on-error: true
        run: python scripts/run_cloud_ci_parity.py

      - name: Release build
        id: release_build
        continue-on-error: true
        run: cargo build --workspace --release

      - name: Report deterministic gate outcomes
        if: always()
        id: gate_report
        env:
          RUSTFMT: ${{ steps.rustfmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          PYTHON_TESTS: ${{ steps.python_tests.outcome }}
          DEBUG_BUILD: ${{ steps.debug_build.outcome }}
          PARITY: ${{ steps.parity.outcome }}
          RELEASE_BUILD: ${{ steps.release_build.outcome }}
        run: |
          set -euo pipefail
          printf '%-20s %s\n' \
            rustfmt "$RUSTFMT" \
            clippy "$CLIPPY" \
            rust_tests "$RUST_TESTS" \
            python_tests "$PYTHON_TESTS" \
            debug_build "$DEBUG_BUILD" \
            parity "$PARITY" \
            release_build "$RELEASE_BUILD"
          python3 - <<'PY'
          import os
          names = ['RUSTFMT','CLIPPY','RUST_TESTS','PYTHON_TESTS','DEBUG_BUILD','PARITY','RELEASE_BUILD']
          failed = [name for name in names if os.environ.get(name) != 'success']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('all_pass=' + ('true' if not failed else 'false') + '\n')
              f.write('failed_gates=' + ','.join(failed) + '\n')
          print('failed_gates=' + (','.join(failed) if failed else 'none'))
          PY

      - name: Publish CI status to Automation Dashboard
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALL_PASS: ${{ steps.gate_report.outputs.all_pass }}
          FAILED_GATES: ${{ steps.gate_report.outputs.failed_gates }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUSTFMT: ${{ steps.rustfmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          PYTHON_TESTS: ${{ steps.python_tests.outcome }}
          DEBUG_BUILD: ${{ steps.debug_build.outcome }}
          PARITY: ${{ steps.parity.outcome }}
          RELEASE_BUILD: ${{ steps.release_build.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          passed = os.environ.get('ALL_PASS') == 'true'
          status = 'PASS' if passed else 'FAILED'
          pr = os.environ.get('PR_NUMBER') or 'n/a'
          gates = ', '.join([
              f"rustfmt={os.environ.get('RUSTFMT','unknown')}",
              f"clippy={os.environ.get('CLIPPY','unknown')}",
              f"rust_tests={os.environ.get('RUST_TESTS','unknown')}",
              f"python_tests={os.environ.get('PYTHON_TESTS','unknown')}",
              f"debug_build={os.environ.get('DEBUG_BUILD','unknown')}",
              f"parity={os.environ.get('PARITY','unknown')}",
              f"release_build={os.environ.get('RELEASE_BUILD','unknown')}",
          ])
          failed = os.environ.get('FAILED_GATES') or 'none'
          body = '\n'.join([
              f'STATUS: {status}',
              'PHASE: Rust migration / deterministic parity',
              f"BRANCH/PR: {os.environ.get('REF_NAME','unknown')} / {pr} / {os.environ.get('HEAD_SHA','unknown')}",
              f"SELF-HOSTED CI: {status} — {os.environ.get('RUN_URL','')}",
              'LOCAL AUTOPILOT: see Issue #2 for sanitized local report',
              f'KEY GATES: {gates}',
              f'KEY FINDING: explicit deterministic verdict; failed_gates={failed}',
              'BLOCKER: none' if passed else f'BLOCKER: deterministic gates failed: {failed}',
              'NEXT: autonomous loop evaluates exact failing gates; PR #1 remains unmerged automatically',
              'COST: self-hosted/local compute',
              'UPDATED: workflow completion time',
          ])
          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/6/comments"
          req = urllib.request.Request(url, data=json.dumps({'body': body}).encode(), method='POST', headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=20) as r:
              print('dashboard HTTP', r.status)
          PY

      - name: Enforce deterministic gate verdict
        if: always()
        env:
          ALL_PASS: ${{ steps.gate_report.outputs.all_pass }}
        run: |
          test "$ALL_PASS" = "true"
