name: CrossAlpha Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crossalpha-rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CROSSALPHA_CLOUD_CI: "1"
  TIINGO_API_TOKEN: ""
  FRED_API_KEY: ""
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""

jobs:
  deterministic-gates:
    name: Rust + Python deterministic gates
    # Never execute untrusted fork code on the private CrossAlpha machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner safety preflight
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "workspace=$GITHUB_WORKSPACE"
          echo "production_data=false"
          echo "production_writes=false"
          test "$GITHUB_WORKSPACE" != "/mnt/disk2/CrossAlpha"
          test ! -e /mnt/disk2/CrossAlphaData/.crossalpha-ci-write-probe

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Python reference environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rustfmt gate
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy hard gate
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        id: rust_tests
        continue-on-error: true
        run: cargo test --workspace

      - name: Python reference tests
        id: python_tests
        continue-on-error: true
        run: pytest -q

      - name: Debug build
        id: debug_build
        continue-on-error: true
        run: cargo build --workspace

      - name: Deterministic Python-Rust parity
        id: parity
        continue-on-error: true
        run: python scripts/run_cloud_ci_parity.py

      - name: Release build
        id: release_build
        continue-on-error: true
        run: cargo build --workspace --release

      - name: Gate summary
        if: always()
        env:
          RUSTFMT: ${{ steps.rustfmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          PYTHON_TESTS: ${{ steps.python_tests.outcome }}
          DEBUG_BUILD: ${{ steps.debug_build.outcome }}
          PARITY: ${{ steps.parity.outcome }}
          RELEASE_BUILD: ${{ steps.release_build.outcome }}
        run: |
          set -euo pipefail
          printf '%-20s %s\n' \
            rustfmt "$RUSTFMT" \
            clippy "$CLIPPY" \
            rust_tests "$RUST_TESTS" \
            python_tests "$PYTHON_TESTS" \
            debug_build "$DEBUG_BUILD" \
            parity "$PARITY" \
            release_build "$RELEASE_BUILD"

          failed=0
          for result in \
            "$RUSTFMT" \
            "$CLIPPY" \
            "$RUST_TESTS" \
            "$PYTHON_TESTS" \
            "$DEBUG_BUILD" \
            "$PARITY" \
            "$RELEASE_BUILD"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
