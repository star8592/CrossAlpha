name: CrossAlpha Rust CI

on:
  push:
    branches:
      - main
      - feat/rust-core-v01
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: crossalpha-rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CROSSALPHA_CLOUD_CI: "1"
  TIINGO_API_TOKEN: ""
  FRED_API_KEY: ""
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""

jobs:
  deterministic-gates:
    name: Rust + Python deterministic gates
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner safety preflight
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "workspace=$GITHUB_WORKSPACE"
          echo "production_data=false"
          echo "production_writes=false"
          test "$GITHUB_WORKSPACE" != "/mnt/disk2/CrossAlpha"
          test ! -e /mnt/disk2/CrossAlphaData/.crossalpha-ci-write-probe

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Python reference environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic gates with explicit return codes
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-gates
          run_gate() {
            local name="$1"; shift
            echo "===== $name ====="
            set +e
            "$@" >".ci-gates/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" > ".ci-gates/${name}.rc"
            echo "$name rc=$rc"
            tail -n 20 ".ci-gates/${name}.log" || true
          }
          run_gate rustfmt cargo fmt --all -- --check
          run_gate clippy cargo clippy --workspace --all-targets -- -D warnings
          run_gate rust_tests cargo test --workspace
          run_gate python_tests pytest -q
          run_gate debug_build cargo build --workspace
          run_gate parity python scripts/run_cloud_ci_parity.py
          run_gate release_build cargo build --workspace --release
          python3 - <<'PY'
          import os, pathlib
          names=['rustfmt','clippy','rust_tests','python_tests','debug_build','parity','release_build']
          failed=[]
          for name in names:
              rc=int(pathlib.Path(f'.ci-gates/{name}.rc').read_text().strip())
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                  f.write(f'{name}_rc={rc}\n')
              if rc != 0:
                  failed.append(name)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('all_pass=' + ('true' if not failed else 'false') + '\n')
              f.write('failed_gates=' + ','.join(failed) + '\n')
          print('failed_gates=' + (','.join(failed) if failed else 'none'))
          PY

      - name: Publish CI status to Automation Dashboard
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALL_PASS: ${{ steps.gates.outputs.all_pass }}
          FAILED_GATES: ${{ steps.gates.outputs.failed_gates }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUSTFMT_RC: ${{ steps.gates.outputs.rustfmt_rc }}
          CLIPPY_RC: ${{ steps.gates.outputs.clippy_rc }}
          RUST_TESTS_RC: ${{ steps.gates.outputs.rust_tests_rc }}
          PYTHON_TESTS_RC: ${{ steps.gates.outputs.python_tests_rc }}
          DEBUG_BUILD_RC: ${{ steps.gates.outputs.debug_build_rc }}
          PARITY_RC: ${{ steps.gates.outputs.parity_rc }}
          RELEASE_BUILD_RC: ${{ steps.gates.outputs.release_build_rc }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request
          passed=os.environ.get('ALL_PASS')=='true'
          failed=[x for x in (os.environ.get('FAILED_GATES') or '').split(',') if x]
          rcs={
              'rustfmt':os.environ.get('RUSTFMT_RC','?'), 'clippy':os.environ.get('CLIPPY_RC','?'),
              'rust_tests':os.environ.get('RUST_TESTS_RC','?'), 'python_tests':os.environ.get('PYTHON_TESTS_RC','?'),
              'debug_build':os.environ.get('DEBUG_BUILD_RC','?'), 'parity':os.environ.get('PARITY_RC','?'),
              'release_build':os.environ.get('RELEASE_BUILD_RC','?')}
          diagnostics=[]
          for name in failed:
              p=pathlib.Path(f'.ci-gates/{name}.log')
              if not p.exists(): continue
              lines=p.read_text(errors='replace').splitlines()[-12:]
              safe=[]
              for line in lines:
                  if re.search(r'(TOKEN|SECRET|PASSWORD|API[_-]?KEY)', line, re.I):
                      safe.append('[redacted credential-like line]')
                  else:
                      safe.append(line[:300])
              diagnostics.append(f'[{name}]\n'+'\n'.join(safe))
          status='PASS' if passed else 'FAILED'
          pr=os.environ.get('PR_NUMBER') or 'n/a'
          body='\n'.join([
              f'STATUS: {status}',
              'PHASE: Rust migration / deterministic parity',
              f"BRANCH/PR: {os.environ.get('REF_NAME','unknown')} / {pr} / {os.environ.get('HEAD_SHA','unknown')}",
              f"SELF-HOSTED CI: {status} — {os.environ.get('RUN_URL','')}",
              'LOCAL AUTOPILOT: see Issue #2 for sanitized local report',
              'KEY GATES: '+', '.join(f'{k}=rc{v}' for k,v in rcs.items()),
              'KEY FINDING: explicit command return codes; failed_gates=' + (','.join(failed) if failed else 'none'),
              'BLOCKER: none' if passed else 'BLOCKER: exact failed gates captured below',
              'DIAGNOSTICS:\n' + ('\n---\n'.join(diagnostics) if diagnostics else 'none'),
              'NEXT: patch only the captured evidence-backed defect; PR #1 remains unmerged automatically',
              'COST: self-hosted/local compute',
              'UPDATED: workflow completion time'])
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/6/comments"
          req=urllib.request.Request(url,data=json.dumps({'body':body}).encode(),method='POST',headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r: print('dashboard HTTP',r.status)
          PY

      - name: Enforce deterministic gate verdict
        if: always()
        env:
          ALL_PASS: ${{ steps.gates.outputs.all_pass }}
        run: test "$ALL_PASS" = "true"
