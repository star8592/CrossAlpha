name: CrossAlpha Migration Drift Repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossalpha-migration-drift-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/rust-core-v01
          fetch-depth: 0

      - name: Explain manual-only boundary
        run: |
          echo 'This workflow is retained only as a manual diagnostic/repair entrypoint.'
          echo 'Unknown CI failures should be delegated to Codex after the repository Codex Cloud environment is configured.'
          echo 'No automatic source mutation is performed by this workflow.'
