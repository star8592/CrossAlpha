name: CrossAlpha Migration Drift Repair

on:
  push:
    branches:
      - feat/rust-core-v01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossalpha-migration-drift-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[arrow-utc-repair]')
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/rust-core-v01
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic Python environment
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'

      - name: Apply canonical UTC metadata repair
        run: |
          set -euo pipefail
          python scripts/repair_arrow_utc_metadata.py
          cargo fmt --all
          git diff --check

      - name: Verify targeted regressions
        run: |
          set -euo pipefail
          cargo test -p crossalpha-features feature_time_columns_are_timestamp_ns_utc
          cargo build --workspace
          python scripts/verify_rust_free_core_parity.py

      - name: Commit repair
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair diff produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/crossalpha-features/src/feature_parquet.rs crates/crossalpha-data/src/free_core.rs
          git commit -m 'fix: normalize Arrow UTC timezone metadata'
          git push origin HEAD:feat/rust-core-v01
