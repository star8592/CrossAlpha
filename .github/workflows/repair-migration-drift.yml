name: CrossAlpha Migration Drift Repair

on:
  workflow_dispatch:
  push:
    branches:
      - feat/rust-core-v01

permissions:
  contents: write

concurrency:
  group: crossalpha-migration-drift-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/rust-core-v01
          fetch-depth: 0

      - name: Apply evidence-backed Rust repair once
        id: repair
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'bot push: repair intentionally skipped'
            exit 0
          fi
          if ! git log -1 --format=%B | grep -Fq '[rust-repair-20260907]'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'ordinary push: one-shot repair intentionally skipped'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match in {path}, got {count}')
              p.write_text(text.replace(old, new, 1))
              print(f'patched: {label}')

          replace_once(
              'crates/crossalpha-features/src/canonical/aave.rs',
              '''fn to_float(value: &Value) -> Option<f64> {
    let number = if let Some(number) = value.as_f64() {
        number
    } else if let Some(text) = value.as_str() {
        text.trim()
            .replace('%', "")
            .replace(',', "")
            .parse::<f64>()
            .ok()?
    } else {
        return None;
    };
    number.is_finite().then_some(number)
}
''',
              '''fn to_float(value: &Value) -> Option<f64> {
    let number = if let Some(number) = value.as_f64() {
        number
    } else {
        let text = value.as_str()?;
        text.trim().replace(['%', ','], "").parse::<f64>().ok()?
    };
    number.is_finite().then_some(number)
}
''',
              'aave numeric parser clippy cleanup',
          )

          replace_once(
              'crates/crossalpha-features/src/recent_features.rs',
              '''fn select_records<'a>(
    records: &'a [RawSnapshotManifest],
    source: CanonicalSource,
) -> Vec<&'a RawSnapshotManifest> {
''',
              '''fn select_records(
    records: &[RawSnapshotManifest],
    source: CanonicalSource,
) -> Vec<&RawSnapshotManifest> {
''',
              'elide needless select_records lifetime',
          )

          census = Path('crates/crossalpha-state/src/v03/census.rs')
          text = census.read_text()
          marker = 'pub fn decode_get_user_account_data(result: &str) -> Result<AccountMetrics> {'
          if marker not in text:
              raise SystemExit('v03 census decode marker missing')
          if 'pub fn normalize_address(' in text or 'pub fn borrow_log_debtor(' in text:
              raise SystemExit('v03 census helper already exists unexpectedly')
          helpers = r'''pub fn normalize_address(address: &str) -> Result<String> {
    let raw = address
        .strip_prefix("0x")
        .or_else(|| address.strip_prefix("0X"))
        .context("Ethereum address lacks 0x prefix")?;
    if raw.len() != 40 || !raw.bytes().all(|byte| byte.is_ascii_hexdigit()) {
        bail!("Ethereum address must contain exactly 20 hex bytes");
    }
    Ok(format!("0x{}", raw.to_ascii_lowercase()))
}

pub fn encode_get_user_account_data(address: &str, selector: &str) -> Result<String> {
    let address = normalize_address(address)?;
    let selector = selector
        .strip_prefix("0x")
        .or_else(|| selector.strip_prefix("0X"))
        .unwrap_or(selector);
    if selector.len() != 8 || !selector.bytes().all(|byte| byte.is_ascii_hexdigit()) {
        bail!("getUserAccountData selector must contain exactly 4 hex bytes");
    }
    Ok(format!(
        "0x{}{:0>64}",
        selector.to_ascii_lowercase(),
        &address[2..]
    ))
}

pub fn borrow_log_debtor(log: &Value, expected_topic0: &str) -> Option<String> {
    let object = log.as_object()?;
    let topics = object.get("topics").and_then(Value::as_array);
    let topic0 = object
        .get("topic0")
        .and_then(Value::as_str)
        .or_else(|| topics?.first()?.as_str())?;
    if !topic0.eq_ignore_ascii_case(expected_topic0) {
        return None;
    }
    let encoded = object
        .get("topic2")
        .and_then(Value::as_str)
        .or_else(|| topics?.get(2)?.as_str())?;
    let raw = encoded
        .strip_prefix("0x")
        .or_else(|| encoded.strip_prefix("0X"))?;
    if raw.len() < 40 || !raw.bytes().all(|byte| byte.is_ascii_hexdigit()) {
        return None;
    }
    normalize_address(&format!("0x{}", &raw[raw.len() - 40..])).ok()
}

'''
          census.write_text(text.replace(marker, helpers + marker, 1))
          print('patched: restore V0.3 ABI/address helpers')

          binding_old = '''    let binding = binding_ok
        .then(|| serde_json::from_reader::<_, Value>(File::open(&binding_path)?))
        .transpose()?;
'''
          binding_new = '''    let binding = if binding_ok {
        Some(serde_json::from_reader::<_, Value>(File::open(&binding_path)?)?)
    } else {
        None
    };
'''
          for path in [
              'crates/crossalpha-state/src/v02/prospective.rs',
              'crates/crossalpha-state/src/v03/prospective.rs',
              'crates/crossalpha-state/src/v04/prospective.rs',
          ]:
              replace_once(path, binding_old, binding_new, f'fix binding error propagation in {path}')

          replace_once(
              'crates/crossalpha-state/src/v04/provider.rs',
              '            _ => bail!("unsupported venue"),\n',
              '            _ => Err(anyhow::anyhow!("unsupported venue")),\n',
              'V0.4 collect_safe result type',
          )

          replace_once(
              'crates/crossalpha-state/src/v04/provider.rs',
              '''    async fn get(&self, url: &str, params: &[(&&str, &str)]) -> Result<Value> {
        let pairs: Vec<(&str, &str)> = params.iter().map(|(key, value)| (**key, *value)).collect();
        let response = self
            .client
            .get(url)
            .query(&pairs)
            .send()
            .await
            .context("VenueTransportError")?
            .error_for_status()
            .context("VenueHttpStatusError")?;
        response.json().await.context("VenueJsonDecodeError")
    }
''',
              '''    fn get(
        &self,
        url: &str,
        params: &[(&&str, &str)],
    ) -> impl std::future::Future<Output = Result<Value>> + Send + 'static {
        let client = self.client.clone();
        let url = url.to_owned();
        let pairs: Vec<(String, String)> = params
            .iter()
            .map(|(key, value)| ((**key).to_owned(), (*value).to_owned()))
            .collect();
        async move {
            let response = client
                .get(&url)
                .query(&pairs)
                .send()
                .await
                .context("VenueTransportError")?
                .error_for_status()
                .context("VenueHttpStatusError")?;
            response.json().await.context("VenueJsonDecodeError")
        }
    }
''',
              'V0.4 own HTTP query parameters before await',
          )

          provider = Path('crates/crossalpha-state/src/v04/provider.rs')
          text = provider.read_text()
          start = text.index('    let mut spot_bid = None;')
          end = text.index('    if let Some(time) = settled_time.as_deref() {', start)
          replacement = r'''    let (
        spot_bid,
        spot_ask,
        perp_bid,
        perp_ask,
        mark,
        index,
        oi_usd,
        settled_rate,
        settled_interval,
        settled_time,
        mut source_times,
    ) = match payload.venue.as_str() {
        "binance" => {
            let spot_bid = number(payload.spot.get("bidPrice"));
            let spot_ask = number(payload.spot.get("askPrice"));
            let perp_bid = first_book_price(payload.perp_depth.get("bids"));
            let perp_ask = first_book_price(payload.perp_depth.get("asks"));
            let mark = number(payload.premium.get("markPrice"));
            let index = number(payload.premium.get("indexPrice"));
            let funding = funding_rows(&payload.funding_history);
            let (settled_rate, settled_interval, settled_time) =
                settled_funding(&funding, "fundingRate", "fundingTime");
            let perp_mid = mid(perp_bid, perp_ask);
            let oi_usd = number(payload.open_interest.get("openInterest"))
                .zip(perp_mid)
                .map(|(base, price)| base * price);
            let source_times = [
                payload.premium.get("time").cloned(),
                payload.open_interest.get("time").cloned(),
                payload.perp_depth.get("E").cloned(),
                payload.perp_depth.get("T").cloned(),
            ]
            .into_iter()
            .flatten()
            .collect();
            (
                spot_bid,
                spot_ask,
                perp_bid,
                perp_ask,
                mark,
                index,
                oi_usd,
                settled_rate,
                settled_interval,
                settled_time,
                source_times,
            )
        }
        "okx" => {
            let spot = okx_item(&payload.spot);
            let perp = okx_item(&payload.perp);
            let oi = okx_item(&payload.open_interest);
            let spot_bid = number(spot.get("bidPx"));
            let spot_ask = number(spot.get("askPx"));
            let perp_bid = number(perp.get("bidPx"));
            let perp_ask = number(perp.get("askPx"));
            let funding = okx_rows(&payload.funding_history);
            let (settled_rate, settled_interval, settled_time) =
                settled_funding(&funding, "realizedRate", "fundingTime");
            let oi_usd = number(oi.get("oiUsd"));
            let source_times = [
                spot.get("ts").cloned(),
                perp.get("ts").cloned(),
                oi.get("ts").cloned(),
            ]
            .into_iter()
            .flatten()
            .collect();
            (
                spot_bid,
                spot_ask,
                perp_bid,
                perp_ask,
                None,
                None,
                oi_usd,
                settled_rate,
                settled_interval,
                settled_time,
                source_times,
            )
        }
        "bybit" => {
            let (spot, spot_time) = bybit_item(&payload.spot);
            let (perp, perp_time) = bybit_item(&payload.perp);
            let spot_bid = number(spot.get("bid1Price"));
            let spot_ask = number(spot.get("ask1Price"));
            let perp_bid = number(perp.get("bid1Price"));
            let perp_ask = number(perp.get("ask1Price"));
            let mark = number(perp.get("markPrice"));
            let index = number(perp.get("indexPrice"));
            let funding = bybit_rows(&payload.funding_history);
            let (settled_rate, settled_interval, settled_time) =
                settled_funding(&funding, "fundingRate", "fundingRateTimestamp");
            let oi_usd = number(perp.get("openInterestValue"));
            let source_times = [spot_time, perp_time].into_iter().flatten().collect();
            (
                spot_bid,
                spot_ask,
                perp_bid,
                perp_ask,
                mark,
                index,
                oi_usd,
                settled_rate,
                settled_interval,
                settled_time,
                source_times,
            )
        }
        _ => unreachable!(),
    };
'''
          provider.write_text(text[:start] + replacement + text[end:])
          print('patched: V0.4 parse snapshot single-assignment tuple')
          PY

          cargo fmt --all
          git diff --check
          if git diff --quiet --; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'repair unexpectedly produced no diff'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit repair
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates
          git commit -m 'fix: repair Rust 1.98 migration regressions'
          git push origin HEAD:feat/rust-core-v01
          echo "repair_commit=$(git rev-parse HEAD)"

      - name: Repair summary
        if: always()
        run: |
          echo "changed=${{ steps.repair.outputs.changed }}"
          echo 'No production data, credentials, strategy parameters, tolerances, or frozen contracts were modified.'
