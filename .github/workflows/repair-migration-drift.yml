name: CrossAlpha Migration Drift Repair

on:
  push:
    branches:
      - feat/rust-core-v01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossalpha-migration-drift-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run47-repair]')
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/rust-core-v01
          fetch-depth: 0

      - name: Apply run 47 evidence-backed repair
        run: |
          set -euo pipefail
          python scripts/repair_rust_198_run47.py
          cargo fmt --all
          git diff --check

      - name: Verify repaired Rust state crate
        run: |
          set -euo pipefail
          cargo check -p crossalpha-state
          cargo clippy -p crossalpha-state --all-targets -- -D warnings

      - name: Commit repair
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair diff produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/crossalpha-state/src
          git commit -m 'fix: clear Rust 1.98 run 47 regressions'
          git push origin HEAD:feat/rust-core-v01
