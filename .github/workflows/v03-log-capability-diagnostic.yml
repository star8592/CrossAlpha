name: CrossAlpha V03 Log Capability Diagnostic

on:
  push:
    branches:
      - feat/rust-core-v01

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[v03-log-capability]')
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: feat/rust-core-v01
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: python -m pip install -e .

      - name: Probe safe log capabilities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import re
          import httpx
          from crossalpha.settings import Settings
          from crossalpha.state.v03_logs import resolve_borrow_log_rpc_candidates
          from crossalpha.state.v03_rpc import AAVE_V3_ETHEREUM_DEPLOYMENT_BLOCK, AaveBorrowerRpc, RpcPolicy

          def classify(exc):
              row={'type': type(exc).__name__}
              if isinstance(exc, httpx.HTTPStatusError):
                  row['http_status']=exc.response.status_code
              text=str(exc)
              match=re.search(r"['\"]code['\"]\s*:\s*(-?\d+)", text)
              if match:
                  row['rpc_error_code']=int(match.group(1))
              return row

          async def main():
              settings=Settings()
              start=AAVE_V3_ETHEREUM_DEPLOYMENT_BLOCK
              spans=(1, 16, 256)
              for url, source in resolve_borrow_log_rpc_candidates(settings.evm_rpc_url):
                  rpc=AaveBorrowerRpc(url, policy=RpcPolicy(timeout_seconds=settings.crossalpha_http_timeout))
                  for span in spans:
                      try:
                          rows=await rpc.borrow_logs(start, start+span-1)
                          print({'source':source,'span':span,'ok':True,'rows':len(rows)})
                      except Exception as exc:
                          print({'source':source,'span':span,'ok':False,**classify(exc)})
                          break
          asyncio.run(main())
          PY
