name: CrossAlpha V03 Bootstrap Retry

on:
  push:
    branches:
      - feat/rust-core-v01

permissions:
  contents: read

concurrency:
  group: crossalpha-v03-bootstrap-retry
  cancel-in-progress: false

jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, '[v03-bootstrap-retry]')
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 45
    env:
      CANONICAL_REPO: /mnt/disk2/CrossAlpha
      DATA_ROOT: /mnt/disk2/CrossAlphaData
    steps:
      - name: Sync exact head without changing writer ownership
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANONICAL_REPO"
          git fetch origin feat/rust-core-v01
          git switch feat/rust-core-v01
          git reset --hard "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$DATA_ROOT/research/state_v03/freeze.json"
          systemctl --user is-active --quiet crossalpha-state-v02.timer
          ! systemctl --user is-active --quiet crossalpha-daemon.service
          ! systemctl --user is-active --quiet crossalpha-state-v03.timer

      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANONICAL_REPO"
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Run one bounded V03 bootstrap cycle
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANONICAL_REPO"
          export CROSSALPHA_DATA_DIR="$DATA_ROOT"
          .venv/bin/crossalpha-state-v03-preflight
          .venv/bin/crossalpha-state-v03-cycle
          .venv/bin/crossalpha-state-v03-integrity
          echo 'v03_bounded_bootstrap_cycle=true'

      - name: Preserve writer ownership invariant
        if: always()
        shell: bash
        run: |
          systemctl --user is-active --quiet crossalpha-state-v02.timer
          ! systemctl --user is-active --quiet crossalpha-daemon.service
          ! systemctl --user is-active --quiet crossalpha-state-v03.timer
