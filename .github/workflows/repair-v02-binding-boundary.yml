name: CrossAlpha V02 Legacy Binding Boundary Repair

on:
  push:
    branches:
      - feat/rust-core-v01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossalpha-v02-binding-boundary-repair
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[v02-binding-repair]')
    runs-on: [self-hosted, linux, x64, crossalpha]
    timeout-minutes: 90
    env:
      PROD_ROOT: /mnt/disk2/CrossAlphaData
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/rust-core-v01
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy
          rustup default stable
          python -m pip install -e '.[dev]'

      - name: Apply V02 handoff repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v02_binding_boundary_patch.py
          cargo fmt --all
          git diff --check

      - name: Verify unit and workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace
          cargo build --workspace --release

      - name: Verify legacy handoff on isolated production mirror
        shell: bash
        run: |
          set -euo pipefail
          TMP_ROOT="$(mktemp -d /tmp/crossalpha-v02-binding.XXXXXX)"
          trap 'rm -rf "$TMP_ROOT"' EXIT

          # Mirror production by symlink for read-only dependencies. Copy only V02,
          # the namespace this verification is allowed to mutate.
          for item in "$PROD_ROOT"/*; do
            name="$(basename "$item")"
            [[ "$name" == research ]] && continue
            ln -s "$item" "$TMP_ROOT/$name"
          done
          mkdir -p "$TMP_ROOT/research"
          for item in "$PROD_ROOT/research"/*; do
            name="$(basename "$item")"
            if [[ "$name" == state_v02 ]]; then
              cp -a "$item" "$TMP_ROOT/research/state_v02"
            else
              ln -s "$item" "$TMP_ROOT/research/$name"
            fi
          done
          rm -f "$TMP_ROOT/research/state_v02/rust_runtime_binding.json"
          rm -f "$TMP_ROOT/research/state_v02/legacy_python_integrity_attestation.json"

          BEFORE="$(find "$TMP_ROOT/research/state_v02/prospective" -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          CROSSALPHA_DATA_DIR="$TMP_ROOT" python scripts/attest_state_v02_legacy_ledger.py --data-root "$TMP_ROOT"
          target/release/crossalpha-state-rs v02 freeze --data-root "$TMP_ROOT"
          target/release/crossalpha-state-rs v02 integrity --data-root "$TMP_ROOT" | tee /tmp/crossalpha-v02-native-integrity.json
          AFTER="$(find "$TMP_ROOT/research/state_v02/prospective" -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          python - /tmp/crossalpha-v02-native-integrity.json <<'PY'
          import json, sys
          v=json.load(open(sys.argv[1], encoding='utf-8'))
          assert v['ok'] is True
          assert v['cycle_enabled'] is True
          p=v['prospective']
          assert p['checks']['legacy_python_ledger_immutable'] is True
          assert p['checks']['native_observation_seals'] is True
          assert p['checks']['rust_runtime_binding_links'] is True
          assert p['native_binding_linked_count'] == 0
          assert p['observation_count'] > 0
          print('v02_immutable_handoff_ok=true')
          PY

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated repair diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/crossalpha-state/src/v02/runtime_binding.rs \
                  crates/crossalpha-state/src/v02/prospective.rs \
                  scripts/bind_native_state_runtime.sh
          git commit -m 'fix: preserve V02 legacy ledger across Rust binding'
          git push origin HEAD:feat/rust-core-v01
