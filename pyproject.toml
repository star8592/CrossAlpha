[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossalpha"
version = "0.1.0"
description = "Cross-asset systematic macro research and point-in-time capital-state observatory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - research use"}
authors = [{name = "CrossAlpha"}]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "pytz>=2024.1",
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
]

[project.optional-dependencies]
databento = ["databento>=0.57"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
crossalpha = "crossalpha.cli:main"
crossalpha-free-audit = "crossalpha.core.free_commands:audit_main"
crossalpha-free-returns = "crossalpha.core.free_commands:returns_main"
crossalpha-free-baselines = "crossalpha.core.free_commands:baselines_main"
crossalpha-free-robustness = "crossalpha.core.free_commands:robustness_main"
crossalpha-free-robustness2 = "crossalpha.core.free_commands:robustness2_main"
crossalpha-free-finalize = "crossalpha.core.free_commands:final_evaluation_main"
crossalpha-free-paper-freeze = "crossalpha.core.free_commands:paper_freeze_main"
crossalpha-free-paper-refresh = "crossalpha.core.free_commands:paper_refresh_main"
crossalpha-free-paper-snapshot = "crossalpha.core.free_commands:paper_snapshot_main"
crossalpha-free-paper-mark = "crossalpha.core.free_commands:paper_mark_main"
crossalpha-free-paper-status = "crossalpha.core.free_commands:paper_status_main"
crossalpha-state-shadow = "crossalpha.state.commands:shadow_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
