[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossalpha"
version = "0.1.0"
description = "Cross-asset systematic macro research and point-in-time capital-state observatory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - research use"}
authors = [{name = "CrossAlpha"}]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "pytz>=2024.1",
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
]

[project.optional-dependencies]
databento = ["databento>=0.57"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
crossalpha = "crossalpha.cli:main"
crossalpha-free-audit = "crossalpha.core.free_commands:audit_main"
crossalpha-free-returns = "crossalpha.core.free_commands:returns_main"
crossalpha-free-baselines = "crossalpha.core.free_commands:baselines_main"
crossalpha-free-robustness = "crossalpha.core.free_commands:robustness_main"
crossalpha-free-robustness2 = "crossalpha.core.free_commands:robustness2_main"
crossalpha-free-finalize = "crossalpha.core.free_commands:final_evaluation_main"
crossalpha-free-paper-freeze = "crossalpha.core.free_commands:paper_freeze_main"
crossalpha-free-paper-refresh = "crossalpha.core.free_commands:paper_refresh_main"
crossalpha-free-paper-snapshot = "crossalpha.core.free_commands:paper_snapshot_main"
crossalpha-free-paper-mark = "crossalpha.core.free_commands:paper_mark_main"
crossalpha-free-paper-status = "crossalpha.core.free_commands:paper_status_main"
crossalpha-state-shadow = "crossalpha.state.commands:shadow_main"
crossalpha-state-ab-freeze = "crossalpha.state.commands:ab_freeze_main"
crossalpha-state-ab-snapshot = "crossalpha.state.commands:ab_snapshot_main"
crossalpha-state-ab-mark = "crossalpha.state.commands:ab_mark_main"
crossalpha-state-ab-status = "crossalpha.state.commands:ab_status_main"
crossalpha-state-ab-integrity = "crossalpha.state.commands:ab_integrity_main"
crossalpha-state-v02-describe = "crossalpha.state.commands:v02_describe_main"
crossalpha-state-v02-config-check = "crossalpha.state.commands:v02_config_check_main"
crossalpha-state-v02-freeze = "crossalpha.state.commands:v02_freeze_main"
crossalpha-state-v02-cycle = "crossalpha.state.commands:v02_cycle_main"
crossalpha-state-v02-integrity = "crossalpha.state.commands:v02_integrity_main"
crossalpha-state-v02-status = "crossalpha.state.commands:v02_status_main"
crossalpha-state-v03-config-check = "crossalpha.state.commands:v03_config_check_main"
crossalpha-state-v03-preflight = "crossalpha.state.commands:v03_preflight_main"
crossalpha-state-v03-freeze = "crossalpha.state.commands:v03_freeze_main"
crossalpha-state-v03-cycle = "crossalpha.state.commands:v03_cycle_main"
crossalpha-state-v03-integrity = "crossalpha.state.commands:v03_integrity_main"
crossalpha-state-v03-status = "crossalpha.state.commands:v03_status_main"
crossalpha-state-v04-config-check = "crossalpha.state.v04_commands:config_check_main"
crossalpha-state-v04-preflight = "crossalpha.state.v04_commands:preflight_main"
crossalpha-state-v04-freeze = "crossalpha.state.v04_commands:freeze_main"
crossalpha-state-v04-cycle = "crossalpha.state.v04_commands:cycle_main"
crossalpha-state-v04-integrity = "crossalpha.state.v04_commands:integrity_main"
crossalpha-state-v04-status = "crossalpha.state.v04_commands:status_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
